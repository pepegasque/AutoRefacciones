services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      SA_PASSWORD: "Logi1234!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1' > /dev/null || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  autorefacciones-app:
    build: .
    container_name: autorefacciones-app

    ports:
      - "8081:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=empresa;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "Logi1234!"

volumes:
  sql_data: